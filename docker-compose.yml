services:
  comfy-model-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comfy-model-daemon
    volumes:
      - ./daemon:/app/daemon
      - /mnt/d/comfy/models:/app/daemon/cache
      - /mnt/d/comfy/user/default/workflows:/app/host_workflows
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

