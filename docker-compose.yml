services:
  ottoman:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ottoman
    volumes:
      - ${COMFY_INPUT_DIR}:/app/input
      - ${COMFY_MODELS_DIR}:/app/models
      - ${COMFY_WORKFLOWS_DIR}:/app/workflows
    environment:
      - PYTHONUNBUFFERED=1
      - COMFY_MODELS_DIR=${COMFY_MODELS_DIR}
      - COMFY_INPUT_DIR=${COMFY_INPUT_DIR}
      - COMFY_WORKFLOWS_DIR=${COMFY_WORKFLOWS_DIR}
    restart: unless-stopped

