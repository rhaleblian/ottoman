services:
  comfy-model-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comfy-model-daemon
    volumes:
      - ${COMFY_INPUT_DIR}:/app/input
      - ${COMFY_MODELS_DIR}:/app/models
      - ${COMFY_WORKFLOWS_DIR}:/app/workflows
    environment:
      - PYTHONUNBUFFERED=1
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
    restart: unless-stopped

